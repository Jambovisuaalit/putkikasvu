name: LVI real-company internal draft QA
on:
  push:
    branches: [feat/reusable-lvi-demo]
permissions:
  contents: read
jobs:
  verify-local-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install isolated local browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Generate and verify unpublished real-company draft
        run: node scripts/qa-real-company-demo.mjs
      - name: Save private review evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lvi-upp-internal-unapproved-draft-QA
          path: qa-real-company-demo/
          if-no-files-found: ignore
          retention-days: 7
