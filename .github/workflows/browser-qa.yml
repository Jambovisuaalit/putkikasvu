name: Chromium browser QA (static)
on:
  push:
    branches:
      - release/brand-a11y-static
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and build the reviewed static site
        run: |
          npm ci
          npm run build
      - name: Install isolated browser test runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run genuine Chromium tests
        run: node scripts/browser-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: putkikasvu-browser-qa-screenshots
          path: qa-screenshots/
          if-no-files-found: ignore
          retention-days: 14
