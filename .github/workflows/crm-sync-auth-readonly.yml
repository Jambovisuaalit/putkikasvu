name: CRM isolated authenticated read-only smoke
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crm-isolated-readonly
  cancel-in-progress: false
jobs:
  provider-auth:
    # Never grant secrets to pull_request jobs or arbitrary branches.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: crm-sync-readonly
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Authenticate providers read-only; never send or write
        run: node integrations/crm-sync-auth-readonly-smoke.mjs
        env:
          CRM_SYNC_ENV: test
          CRM_SYNC_TEST_SHEET_ID: 1qGVHhvoUXqAQ5np9PmOc5cgAyUL1i70OBg7wBf-PdZc
          CRM_SYNC_TEST_TAB: TEST CRM
          CRM_SYNC_WRITE: 'false'
          CRM_SYNC_EXPECTED_GMAIL: visualjambo@gmail.com
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
