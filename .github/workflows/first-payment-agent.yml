name: First Payment Agent (read-only)
on:
  push:
    branches: [feature/first-payment-agent-v1]
    paths:
      - 'agent/**'
      - 'tests/**'
      - 'docs/ops/FIRST_PAYMENT_AGENT_ACCESS.md'
      - '.github/workflows/first-payment-agent.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'fixture or protected live-read'
        type: choice
        required: true
        default: fixture
        options: [fixture, live-read]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm test
      - name: Safe fixture audit (no credentials)
        run: node agent/run.mjs --fixture
  # The live-read job never runs on a feature-branch push.
  # Protect first-payment-audit with required reviewers and a release branch restriction.
  live-read:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live-read' && github.ref == 'refs/heads/release/sales-standard-3-5'
    environment: first-payment-audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288ca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check credential prerequisites without printing values
        env:
          PK_SHEET_ID: ${{ vars.PK_SHEET_ID }}
          PK_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.PK_GOOGLE_SERVICE_ACCOUNT_JSON }}
          PK_RESEND_READ_API_KEY: ${{ secrets.PK_RESEND_READ_API_KEY }}
        run: node agent/preflight.mjs
      - name: Read-only external audit
        env:
          PK_SHEET_ID: ${{ vars.PK_SHEET_ID }}
          PK_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.PK_GOOGLE_SERVICE_ACCOUNT_JSON }}
          PK_RESEND_READ_API_KEY: ${{ secrets.PK_RESEND_READ_API_KEY }}
        run: node agent/run.mjs --live-read
